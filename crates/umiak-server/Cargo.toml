[package]
name = "umiak-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Loopback HTTP server for the Shelf. Every Umiak surface talks to this."

[dependencies]
umiak-core = { path = "../umiak-core" }
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["native-tls", "charset", "gzip", "brotli"] }
zip = "2"
serde_json = "1"
native-tls = "0.2"
